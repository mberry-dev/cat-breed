name: Web version

# Tests run on every change to the web version. The site is published to GitHub Pages only from
# main, and only after the tests pass. At deploy time the breed list is fetched from The Cat API with
# the repository secret CAT_API_KEY and published as a plain data file, so the key never reaches the
# page or the repository. A separate job calls the real Cat API to catch it changing under us; it also
# runs weekly, and it never blocks a deploy because the service is outside our control.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:api
        env:
          CAT_API_KEY: ${{ secrets.CAT_API_KEY }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make the breed data file
        env:
          CAT_API_KEY: ${{ secrets.CAT_API_KEY }}
        run: |
          if [ -z "$CAT_API_KEY" ]; then
            echo "::error::The repository secret CAT_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          node web/scripts/update-data.js
      # Publish only the site files, not the tests or node_modules
      - name: Assemble site
        run: |
          mkdir _site
          cp web/index.html web/style.css _site/
          cp -r web/src _site/src
          cp -r web/data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
